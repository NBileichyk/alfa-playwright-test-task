name: Playwright E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Runs on weekdays (Mon-Fri) at 3:00 PM Minsk time (UTC+3)
    - cron: '0 12 * * 1-5'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 4. Install Playwright browsers with system dependencies
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 5. Set up Java (required for Allure CLI report generation)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 6. Run Playwright tests and pass environment secrets
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          TEST_USER_1_EMAIL: ${{ secrets.TEST_USER_1_EMAIL }}
          TEST_USER_1_PASSWORD: ${{ secrets.TEST_USER_1_PASSWORD }}
          TEST_USER_1_FIRST_NAME: ${{ secrets.TEST_USER_1_FIRST_NAME }}
          TEST_USER_1_LAST_NAME: ${{ secrets.TEST_USER_1_LAST_NAME }}
          TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
          TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
          TEST_USER_2_FIRST_NAME: ${{ secrets.TEST_USER_2_FIRST_NAME }}
          TEST_USER_2_LAST_NAME: ${{ secrets.TEST_USER_2_LAST_NAME }}
          BASE_URL: ${{ secrets.BASE_URL }}

      # 7. Upload Playwright HTML Report
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      # 8. Upload Test Results / Traces
      - name: Upload Test Results / Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # 9. Generate Allure HTML report from results
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "::warning::No Allure results were generated; skipping report generation."
          fi

      # 10. Upload Allure Report as an artifact (backup)
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

      # 11. Deploy Allure Report to GitHub Pages (MUST BE THE LAST STEP)
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          clean: true