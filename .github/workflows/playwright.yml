name: Playwright Tests with Allure

on:
  # Проверка при каждом изменении кода
  push:
  pull_request:

  # 1. Запуск вручную из вкладки Actions на GitHub (workflow_dispatch)
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

  # 2. Запуск по расписанию: Понедельник - Пятница в 08:00 UTC (cron)
  schedule:
    - cron: '0 8 * * 1-5'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Устанавливаем зависимости проекта
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Устанавливаем браузеры Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Java необходима для работы Allure CLI
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Запускаем тесты (передаем переменные окружения из GitHub Secrets, если они нужны)
      - name: Run Playwright tests
        run: npx playwright test
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}

      # Генерируем Allure HTML-отчет из результатов
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -n "$(find allure-results -type f -print -quit 2>/dev/null)" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "::warning::No Allure results were generated; skipping report generation."
          fi

      # Сохраняем Allure-отчет в артефактах GitHub
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

      # Сохраняем HTML-отчет (если он успел создаться)
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      # Сохраняем папку test-results (тут лежат трейсы, видео и скриншоты падений)
      - name: Upload Test Results / Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7