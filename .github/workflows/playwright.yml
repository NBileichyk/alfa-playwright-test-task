name: Playwright E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

  schedule:
    # Runs on weekdays (Mon-Fri) at 8:00 AM, 12:00 PM, and 1:00 PM Minsk time (UTC+3)
    - cron: '0 5,9,10 * * 1-5'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          TEST_USER_1_EMAIL: ${{ secrets.TEST_USER_1_EMAIL }}
          TEST_USER_1_PASSWORD: ${{ secrets.TEST_USER_1_PASSWORD }}
          TEST_USER_1_FIRST_NAME: ${{ secrets.TEST_USER_1_FIRST_NAME }}
          TEST_USER_1_LAST_NAME: ${{ secrets.TEST_USER_1_LAST_NAME }}
          TEST_USER_2_EMAIL: ${{ secrets.TEST_USER_2_EMAIL }}
          TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
          TEST_USER_2_FIRST_NAME: ${{ secrets.TEST_USER_2_FIRST_NAME }}
          TEST_USER_2_LAST_NAME: ${{ secrets.TEST_USER_2_LAST_NAME }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -n "$(find allure-results -type f -print -quit 2>/dev/null)" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "::warning::No Allure results were generated; skipping report generation."
          fi

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Test Results / Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
